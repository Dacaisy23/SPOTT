<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPOTT - All Cameroon Live Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body{margin:0;padding:0;font-family:Arial}
#map{height:100vh;width:100%}
.header{position:fixed;top:0;left:0;right:0;z-index:999;background:#000;color:#ffcc00;padding:10px;text-align:center;font-weight:bold;font-size:18px}
.btns{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:999;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:95%}
.btns button{padding:12px 16px;border:none;border-radius:20px;font-weight:bold;cursor:pointer;color:#fff}
.police{background:#ff0000}.accident{background:#ff8800}.traffic{background:#0088ff}.road{background:#555}
</style>
</head>
<body>
<div class="header">SPOTT - LIVE All Cameroon - Buea | Bamenda | Bafoussam | Yaounde | Douala | Garoua | Maroua</div>
<div id="map"></div>
<div class="btns">
<button class="police" onclick="report('Police Control')">Police</button>
<button class="accident" onclick="report('Accident')">Accident</button>
<button class="traffic" onclick="report('Traffic')">Traffic</button>
<button class="road" onclick="report('Bad Road')">Bad Road</button>
</div>
<script>
var map = L.map('map').setView([7.3697, 12.3547], 6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
var cities = [
[4.0511, 9.7679, "Douala"],
[3.8480, 11.5021, "Yaounde"],
[4.1550, 9.2316, "Buea"],
[5.9631, 10.1591, "Bamenda"],
[5.4778, 10.4173, "Bafoussam"],
[9.3017, 13.3927, "Garoua"],
[10.5910, 14.3210, "Maroua"],
[2.9167, 11.1500, "Ebolowa"],
[4.5833, 13.6833, "Bertoua"],
[7.3167, 13.5833, "Ngaoundere"]
];
cities.forEach(c=>{ L.marker([c[0],c[1]]).addTo(map).bindPopup("<b>"+c[2]+"</b><br>SPOTT Active"); });
function report(type){
  var center = map.getCenter();
  L.marker([center.lat, center.lng]).addTo(map).bindPopup("<b>"+type+"</b><br>Just now<br>"+new Date().toLocaleTimeString()).openPopup();
  alert(type + " reported!\nShare https://dacaisy23.github.io/SPOTT/ to drivers!");
}
</script>
</body>
</html>
